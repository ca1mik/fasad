<style>
:root{

  --surface:#FFFFFF;
  --sunk:#E8ECEE;
  --ink:#16202B;

  --ink-3:#6D7F8B;
  --rule:#CBD5DA;
  --rule-soft:#DFE6E9;
  --loss:#CC3311;
  --loss-soft:#F7E4DF;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12181D; --surface:#192127; --sunk:#222C34;
    --ink:#E6EDF1; --ink-2:#A9BAC4; --ink-3:#7C8F9B;
    --rule:#33424C; --rule-soft:#26323A;
    --loss:#FF7C5C; --loss-soft:#3A2019;
    --sys:#6FB3E0; --sys-soft:#152A3A; --ok:#6BC79A;
  }
}
:root[data-theme="dark"]{
  --paper:#12181D; --surface:#192127; --sunk:#222C34;
  --ink:#E6EDF1; --ink-2:#A9BAC4; --ink-3:#7C8F9B;
  --rule:#33424C; --rule-soft:#26323A;
  --loss:#FF7C5C; --loss-soft:#3A2019;
  --sys:#6FB3E0; --sys-soft:#152A3A; --ok:#6BC79A;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 24px 90px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-weight:800;font-size:clamp(27px,4.6vw,42px);line-height:1.1;letter-spacing:-.015em}
h2{font-weight:800;font-size:clamp(21px,3vw,27px);line-height:1.2}
h3{font-weight:600;font-size:18px}
p{margin:0 0 1em}
a{color:var(--sys)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---- панель выбора ---- */
.picker{
  position:sticky;top:0;z-index:20;
  background:var(--surface);border-bottom:1px solid var(--rule);
  padding:14px 24px;margin-bottom:38px;
}
.picker-in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.picker label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
select{
  font-family:var(--body);font-size:15.5px;font-weight:500;
  padding:8px 12px;min-width:280px;flex:1;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;
}
select:focus-visible{outline:2px solid var(--sys);outline-offset:2px}
.badge{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:2px;white-space:nowrap}
.b-A{background:var(--sys-soft);color:var(--sys)}
.b-B{background:var(--sunk);color:var(--ink-2)}
.b-C{background:var(--loss-soft);color:var(--loss)}

section{padding:40px 0;border-top:1px solid var(--rule-soft)}
section:first-of-type{border-top:0;padding-top:8px}
.lede{font-size:18.5px;color:var(--ink-2)}

.quote{
  font-family:var(--display);font-weight:600;font-size:clamp(18px,2.4vw,21px);line-height:1.42;
  border-left:3px solid var(--loss);padding:2px 0 2px 19px;margin:0 0 24px;
}
.meta{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:20px}

/* ---- калькулятор ---- */
.calc{background:var(--surface);border:1px solid var(--rule);padding:24px 24px 8px}
.field{padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.field:last-of-type{border-bottom:0}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.field label{font-size:15px;color:var(--ink-2)}
.field input[type=number]{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;
  width:8ch;text-align:right;background:transparent;color:var(--ink);
  border:0;border-bottom:1px solid var(--rule);padding:1px 2px;
}
.field input[type=number]:focus-visible{outline:2px solid var(--sys);outline-offset:2px}
.unit{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
input[type=range]{width:100%;accent-color:var(--sys);height:20px;cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--sys);outline-offset:3px}
.result{border-top:2px solid var(--ink);margin-top:6px;padding:20px 0 22px}
.rrow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:15px;color:var(--ink-2)}
.rrow b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:12px;padding-top:14px;border-top:1px solid var(--rule)}
.total .lbl{font-family:var(--display);font-weight:600;font-size:16px}
.total .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(24px,4.6vw,34px);font-weight:500;color:var(--loss);white-space:nowrap}
.payback{margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--ink-3);line-height:1.5}
.formula{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--ink-3);background:var(--sunk);padding:14px 15px;margin-top:18px;overflow-x:auto}

/* ---- сценарии ---- */
.scene{padding:18px 0;border-bottom:1px solid var(--rule-soft);display:grid;grid-template-columns:74px 1fr;gap:18px}
.scene:first-child{border-top:1px solid var(--rule-soft)}
.clock{font-family:var(--mono);font-size:12.5px;color:var(--sys);padding-top:3px}
.scene p{margin:4px 0 0;color:var(--ink-2);font-size:15.5px}
@media(max-width:560px){.scene{grid-template-columns:1fr;gap:2px}}

/* ---- пакеты ---- */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.tier{background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px}
.tier.pick{background:var(--sys-soft);box-shadow:inset 0 0 0 2px var(--sys)}
.tier .nm{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tier .pr{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.tier .pr small{display:block;font-family:var(--mono);font-weight:400;font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:0}
.tier p{font-size:14px;color:var(--ink-2);margin:0}
.rec{font-family:var(--mono);font-size:11px;color:var(--sys);margin-top:2px}

/* ---- честный блок ---- */
.honest{border:1px solid var(--loss);background:var(--loss-soft);padding:20px 22px}
.honest ul{margin:8px 0 0;padding-left:19px}
.honest li{margin-bottom:6px;color:var(--ink-2);font-size:15px}

/* ---- письмо ---- */
.letter{background:var(--surface);border:1px solid var(--rule)}
.letter-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.letter-b{padding:18px;font-family:var(--mono);font-size:13.5px;line-height:1.75;white-space:pre-wrap;color:var(--ink)}
.subj{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
button.copy{
  font-family:var(--mono);font-size:12px;padding:6px 13px;cursor:pointer;
  background:var(--sys);color:var(--surface);border:0;border-radius:2px;
}
button.copy:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.contacts{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ok);padding:18px 20px;margin-top:24px}
.contacts .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.contacts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.contacts li{font-family:var(--mono);font-size:13px;color:var(--ink);line-height:1.5}
.contacts .warn{margin:12px 0 0;padding-top:11px;border-top:1px solid var(--rule-soft);font-size:14px;color:var(--ink-2)}
.nocontacts{background:var(--sunk);border:1px dashed var(--rule);padding:16px 20px;margin-top:24px;font-size:14.5px;color:var(--ink-2)}
.objection{border-left:3px solid var(--sys);background:var(--sys-soft);padding:16px 20px;margin-top:18px}
.objection .q{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:6px}
.objection p{margin:0;font-size:15px;color:var(--ink-2)}

.stop{border:2px solid var(--loss);background:var(--loss-soft);padding:24px}
.stop h2{margin-bottom:10px}

.sign{margin-top:30px;padding-top:18px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:13px;line-height:1.8;color:var(--ink-3)}
.ph{background:var(--sunk);padding:1px 6px;border-radius:2px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      tier('sub','от 18 000 ₽','в месяц + внедрение','Обновления, поддержка и доработки входят. Не понравилось — прекращаете платить. Данные остаются у вас.',x.pkg)+
      tier('box','от 350 000 ₽','разово, с исходниками','Система ваша навсегда, код передаётся. Поддержка — отдельным договором по желанию.',x.pkg)+
    '</div>'+
    '<div class="objection"><div class="q">«'+esc(x.obj)+'»</div><p>'+esc(x.obja)+'</p></div>'+
  '</section>'+

  '<section>'+
    '<h2>Первое письмо</h2>'+

    '<div class="letter">'+

function contactBlock(x){
  if(!x.ct){
    return '<div class="nocontacts"><b>Контакты не собраны.</b> Прогон по этой компании не завершился — оборвался на лимите сессии. Телефон и почту брать с сайта компании или из каталога productcenter.ru, и только с той страницы, которую открыли своими глазами.</div>';
  }
  return '<div class="contacts"><div class="hd"><span class="eyebrow">Контакты · проверены на странице</span>'+
    '<span class="eyebrow">'+esc(x.ctsrc)+'</span></div>'+
    '<ul>'+x.ct.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>'+
    (x.ctwarn?'<p class="warn">'+esc(x.ctwarn)+'</p>':'')+'</div>';
}
function fld(id,label,unit,v,mn,mx,st){
  return '<div class="field"><div class="field-top"><label for="'+id+'">'+label+'</label>'+
   '<span><input type="number" id="'+id+'" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+v+'"> <span class="unit">'+unit+'</span></span></div>'+
   '<input type="range" id="'+id+'_r" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+v+'" aria-label="'+label+'"></div>';
}
function scene(t,h,p){
  return '<div class="scene"><div class="clock">'+t+'</div><div><h3>'+h+'</h3><p>'+p+'</p></div></div>';
}
function tier(k,pr,sub,txt,pick){
  return '<div class="tier'+(k===pick?' pick':'')+'"><span class="nm">'+PKG[k]+'</span>'+
   '<span class="pr">'+pr+'<small>'+sub+'</small></span><p>'+txt+'</p>'+
   (k===pick?'<span class="rec">рекомендую этот вход</span>':'')+'</div>';
}

function wire(){
  ['orders','check','defect','lost'].forEach(function(id){
    var n=document.getElementById(id), r=document.getElementById(id+'_r');
    n.addEventListener('input',function(){r.value=n.value;calc();});
    r.addEventListener('input',function(){n.value=r.value;calc();});
  });
  var cp=document.getElementById('cp');
  cp.addEventListener('click',function(){
    var t=document.getElementById('lt').textContent;
    if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){cp.textContent='Скопировано';setTimeout(function(){cp.textContent='Скопировать';},1600);});}
  });
  calc();
}

function calc(){
  var o=+document.getElementById('orders').value||0;
  var c=+document.getElementById('check').value||0;
  var d=(+document.getElementById('defect').value||0)/100;
  var l=(+document.getElementById('lost').value||0)/100;
  var rw=o*12*d*c*0.35, ms=o*2.2*12*l*0.3*c, tot=rw+ms;
  document.getElementById('r1').textContent=F.format(Math.round(rw))+' ₽';
  document.getElementById('r2').textContent=F.format(Math.round(ms))+' ₽';
  document.getElementById('r3').textContent=F.format(Math.round(tot))+' ₽';
  var p=document.getElementById('r4');
  if(tot>0){
    var m=350000/(tot/12);
    p.textContent='Покупка за 350 000 ₽ окупается за '+(m<1?'меньше месяца':F.format(Math.ceil(m))+' мес.')+
      ' · подписка 18 000 ₽/мес — это '+F.format(Math.round(216000/tot*100))+'% от суммы выше';
  } else { p.textContent='Поставьте свои цифры выше.'; }
}

sel.addEventListener('change',render);
render();
})();
</script>
